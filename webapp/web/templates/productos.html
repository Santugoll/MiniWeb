<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Productos</title>
</head>
<body>
  <h1>Productos</h1>
  <a href="/">Volver a usuarios</a>

  <h2 id="titulo-form">Nuevo producto</h2>
  <form id="form-producto">
    <input type="hidden" id="id">
    Nombre: <input id="nombre" required><br>
    Descripción: <input id="descripcion"><br>
    Precio: <input id="precio" type="number" step="0.01" required><br>
    Stock: <input id="stock" type="number" value="0"><br>
    <button type="submit">Guardar</button>
    <button type="button" onclick="limpiar()">Cancelar</button>
  </form>

  <h2>Listado</h2>
  <table border="1" cellpadding="5">
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>

<script>
const API = '/api/productos';

async function cargar() {
  const res = await fetch(API);
  const productos = await res.json();
  const tbody = document.getElementById('tabla');
  tbody.innerHTML = '';
  productos.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${p.id}</td><td>${p.nombre}</td><td>${p.descripcion ?? ''}</td>
      <td>${p.precio}</td><td>${p.stock}</td>
      <td><button onclick='editar(${JSON.stringify(p)})'>Editar</button>
          <button onclick="eliminar(${p.id})">Eliminar</button></td>`;
    tbody.appendChild(tr);
  });
}

function editar(p) {
  document.getElementById('titulo-form').textContent = 'Editar producto';
  document.getElementById('id').value = p.id;
  document.getElementById('nombre').value = p.nombre;
  document.getElementById('descripcion').value = p.descripcion ?? '';
  document.getElementById('precio').value = p.precio;
  document.getElementById('stock').value = p.stock;
}

function limpiar() {
  document.getElementById('form-producto').reset();
  document.getElementById('id').value = '';
  document.getElementById('titulo-form').textContent = 'Nuevo producto';
}

async function eliminar(id) {
  if (!confirm('¿Eliminar producto?')) return;
  await fetch(`${API}/${id}`, { method: 'DELETE' });
  cargar();
}

document.getElementById('form-producto').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('id').value;
  const body = {
    nombre: document.getElementById('nombre').value,
    descripcion: document.getElementById('descripcion').value,
    precio: parseFloat(document.getElementById('precio').value),
    stock: parseInt(document.getElementById('stock').value || 0)
  };
  await fetch(id ? `${API}/${id}` : API, {
    method: id ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  limpiar();
  cargar();
});

cargar();
</script>
</body>
</html>
